
<!DOCTYPE html>

    <script>
      // Unregister service workers and clear caches to force loading of fully bundled assets without esm.sh conflicts
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister().then((success) => {
              if (success) console.log('🔄 SW unregistered successfully');
            });
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then((names) => {
          for (const name of names) {
            caches.delete(name).then(() => console.log('🗑️ Cache deleted:', name));
          }
        });
      }

      // Captura global y persistente del evento de instalación
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        console.log('✅ PWA: Evento de instalación capturado y listo.');
        window.dispatchEvent(new CustomEvent('pwa-ready'));
      });

      window.isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    </script>

    <link href="https://fonts.googleapis.com" rel="preconnect"/>

    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      // Only register Service Worker if NOT in development to prevent caching of dynamic Vite dev files
      const isDevEnv = window.location.hostname.includes('localhost') || 
                       window.location.hostname.includes('127.0.0.1') || 
                       window.location.hostname.includes('ais-dev-') ||
                       window.location.hostname.includes('ais-pre-');
      if ('serviceWorker' in navigator) {
        if (isDevEnv) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister().then(() => console.log('🔄 SW unregistered for development'));
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
              console.log('SW Registered', reg.scope);
            }).catch(err => console.log('SW registration failed', err));
          });
        }
      }
    </script>
</body>
