<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Abarrotes F1 | Prueba multilocal</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Vista de prueba pública con datos ficticios de Abarrotes F1. No registra operaciones.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode:"class",
      theme:{extend:{
        colors:{
          "primary":"#2563eb","background-light":"#f8fafc","background-dark":"#0f172a",
          "surface-dark":"#1e293b","card-dark":"#1e293b",
        },
        fontFamily:{display:["Manrope","sans-serif"]},
      }},
    };
  </script>
  <style>
    * { box-sizing:border-box }
    body {margin:0; min-height:100vh; font-family:Manrope,sans-serif;}
    .dark body { background:#0f172a;color:#e2e8f0 }
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
    button, input, select, textarea {font-family:inherit}
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
      outline:3px solid #93c5fd;outline-offset:2px
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
